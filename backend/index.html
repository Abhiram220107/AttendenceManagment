<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attenza | Smart Event Attendance</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    .login-container {
      background: radial-gradient(circle at 50% 30%, #1E1E1E 0%, #121212 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    
    .brand-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 122, 0, 0.15) 0%, rgba(255, 122, 0, 0) 70%);
      pointer-events: none;
    }
    
    .saas-card {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body>

  <div class="login-container px-3 py-5">
    <div class="brand-glow"></div>
    
    <div class="card saas-card p-4 p-sm-5 w-100 position-relative z-1" style="max-width: 440px;">
      
      <!-- Attenza Brand Logo & Tagline -->
      <div class="text-center mb-4">
        <div class="mb-3 d-inline-block">
          <img src="logo-light.svg" alt="Attenza" style="height: 52px; max-width: 100%;">
        </div>
        <h1 class="fs-6 font-bold text-uppercase tracking-wider text-muted mb-1" style="letter-spacing: 1px;">Attenza Platform</h1>
        <p class="text-muted small fw-medium mb-0">Smart Event Attendance &amp; Verification Platform</p>
      </div>

      <div id="login-box">
        <!-- Action feedback alerts -->
        <div id="login-error-alert" class="alert alert-danger d-none d-flex align-items-center gap-2" role="alert">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <div id="error-message">Invalid credentials</div>
        </div>

        <form id="login-form">
          <!-- Username input -->
          <div class="mb-3">
            <label for="username" class="form-label font-bold text-sm text-dark">Email / Username</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
              <input 
                type="text" 
                id="username" 
                class="form-control border-start-0 py-2.5" 
                placeholder="e.g. participant@example.com or admin" 
                required
              >
            </div>
          </div>

          <!-- Password input -->
          <div class="mb-4">
            <label for="password" class="form-label font-bold text-sm text-dark">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-key"></i></span>
              <input 
                type="password" 
                id="password" 
                class="form-control border-start-0 border-end-0 py-2.5" 
                placeholder="••••••••" 
                required
              >
              <button 
                type="button" 
                id="toggle-password" 
                class="btn btn-outline-secondary border-start-0 bg-light text-muted py-2.5" 
                style="border-color: #dee2e6; z-index: 4;"
                onclick="togglePasswordVisibility()"
              >
                <i id="toggle-password-icon" class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <button 
            type="submit" 
            id="submit-btn" 
            class="btn btn-primary w-100 py-2.5 font-bold mb-3 shadow-sm"
          >
            <span id="btn-text">Sign In to Dashboard</span>
            <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
          </button>

          <!-- Help Info -->
          <div class="alert alert-light text-center small text-muted border mb-0 p-2.5 rounded-3">
            <i class="bi bi-shield-lock me-1 text-primary"></i> <b>Access Notice:</b> Login accounts are issued and managed exclusively by Event Administrators.
          </div>

        </form>
      </div>
    </div>
    
    <!-- Footer -->
    <div class="text-center text-white-50 small mt-4 position-relative z-1">
      &copy; 2026 <strong>Attenza</strong>. Smart Event Attendance &amp; Verification Platform.
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Common JavaScript Controller -->
  <script src="script.js"></script>
  <?!= include('script'); ?>

  <script>
    // Enforce authentication guards
    document.addEventListener("DOMContentLoaded", function() {
      enforceRoleSecurity([], 'index');
    });

    // Form submit controller
    document.getElementById("login-form").addEventListener("submit", function(e) {
      e.preventDefault();
      
      var userVal = document.getElementById("username").value.trim();
      var passVal = document.getElementById("password").value.trim();
      var errorAlert = document.getElementById("login-error-alert");
      var errorMsg = document.getElementById("error-message");
      
      var submitBtn = document.getElementById("submit-btn");
      var btnText = document.getElementById("btn-text");
      var spinner = document.getElementById("btn-spinner");

      errorAlert.classList.add("d-none");
      submitBtn.disabled = true;
      btnText.innerText = "Signing in...";
      spinner.classList.remove("d-none");

      execApi(
        'login',
        { username: userVal, password: passVal },
        function(response) {
          submitBtn.disabled = false;
          btnText.innerText = "Sign In to Dashboard";
          spinner.classList.add("d-none");
          
          if (response.success) {
            saveActiveSession(response);
            if (response.role === 'admin') redirectToPage('admin');
            else if (response.role === 'volunteer') redirectToPage('volunteer');
            else if (response.role === 'student') redirectToPage('student');
          } else {
            errorMsg.innerText = response.message || "Invalid username or password.";
            errorAlert.classList.remove("d-none");
          }
        },
        function(err) {
          submitBtn.disabled = false;
          btnText.innerText = "Sign In to Dashboard";
          spinner.classList.add("d-none");
          errorMsg.innerText = "Server connection lost: " + err.message;
          errorAlert.classList.remove("d-none");
        }
      );
    });

    function togglePasswordVisibility() {
      var passInput = document.getElementById("password");
      var passIcon = document.getElementById("toggle-password-icon");
      if (passInput.type === "password") {
        passInput.type = "text";
        passIcon.className = "bi bi-eye-slash";
      } else {
        passInput.type = "password";
        passIcon.className = "bi bi-eye";
      }
    }
  </script>
</body>
</html>
