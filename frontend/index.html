<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IEEE Event Attendance System - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- Common CSS Styles -->
  <link rel="stylesheet" href="styles.css">
  <?!= include('styles'); ?>
  
  <style>
    .login-container {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="login-container px-3">
    <div class="card card-premium shadow-lg border-0 p-4 w-100" style="max-width: 420px;">
      
      <!-- Brand icon and title -->
      <div class="text-center mb-4">
        <div class="mx-auto rounded bg-primary text-white d-flex align-items-center justify-content-center" style="width: 52px; height: 52px; background-color: var(--ieee-blue) !important;">
          <span class="fs-4 font-bold tracking-wider">IEEE</span>
        </div>
        <h2 class="mt-3 fw-bold text-gray-900">Event Attendance</h2>
        <p class="text-muted small">Sign in to access your dashboard</p>
      </div>

      <div id="login-box">
        <!-- Action feedback alerts -->
        <div id="login-error-alert" class="alert alert-danger d-none d-flex align-items-center gap-2" role="alert">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <div id="error-message">Invalid credentials</div>
        </div>

        <form id="login-form">
          
          <!-- Username input -->
          <div class="mb-3">
            <label for="username" class="form-label font-bold text-sm">Username / Registration Number</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
              <input 
                type="text" 
                id="username" 
                class="form-control border-start-0 py-2.5" 
                placeholder="e.g. MCSE-01 or admin" 
                required
              >
            </div>
          </div>

          <!-- Password input -->
          <div class="mb-4">
            <label for="password" class="form-label font-bold text-sm">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-key"></i></span>
              <input 
                type="password" 
                id="password" 
                class="form-control border-start-0 border-end-0 py-2.5" 
                placeholder="••••••••" 
                required
              >
              <button 
                type="button" 
                id="toggle-password" 
                class="btn btn-outline-secondary border-start-0 bg-light text-muted py-2.5" 
                style="border-color: #dee2e6; z-index: 4;"
                onclick="togglePasswordVisibility()"
              >
                <i id="toggle-password-icon" class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <button 
            type="submit" 
            id="submit-btn" 
            class="btn btn-primary w-100 py-2.5 font-bold mb-3" 
            style="background-color: var(--ieee-blue); border-color: var(--ieee-blue);"
          >
            <span id="btn-text">Sign In</span>
            <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
          </button>

          <!-- Guidelines alert box -->
          <div class="alert alert-light text-center small text-muted border mb-0 p-2">
            <b>Students:</b> Username is Registration Number (e.g. MCSE - 01), Password is provided by admin.
          </div>

        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Common JavaScript Controller -->
  <script src="script.js"></script>
  <?!= include('script'); ?>

  <script>
    // Enforce authentication guards
    document.addEventListener("DOMContentLoaded", function() {
      enforceRoleSecurity([], 'index');
    });

    // Form submit controller
    document.getElementById("login-form").addEventListener("submit", function(e) {
      e.preventDefault();
      
      var userVal = document.getElementById("username").value.trim();
      var passVal = document.getElementById("password").value.trim();
      var errorAlert = document.getElementById("login-error-alert");
      var errorMsg = document.getElementById("error-message");
      
      var submitBtn = document.getElementById("submit-btn");
      var btnText = document.getElementById("btn-text");
      var spinner = document.getElementById("btn-spinner");

      errorAlert.classList.add("d-none");
      submitBtn.disabled = true;
      btnText.innerText = "Signing in...";
      spinner.classList.remove("d-none");

      execApi(
        'login',
        { username: userVal, password: passVal },
        function(response) {
          submitBtn.disabled = false;
          btnText.innerText = "Sign In";
          spinner.classList.add("d-none");
          
          if (response.success) {
            saveActiveSession(response);
            if (response.role === 'admin') redirectToPage('admin');
            else if (response.role === 'volunteer') redirectToPage('volunteer');
            else if (response.role === 'student') redirectToPage('student');
          } else {
            errorMsg.innerText = response.message || "Invalid username or password.";
            errorAlert.classList.remove("d-none");
          }
        },
        function(err) {
          submitBtn.disabled = false;
          btnText.innerText = "Sign In";
          spinner.classList.add("d-none");
          errorMsg.innerText = "Server connection lost: " + err.message;
          errorAlert.classList.remove("d-none");
        }
      );
    });

    function togglePasswordVisibility() {
      var passInput = document.getElementById("password");
      var passIcon = document.getElementById("toggle-password-icon");
      if (passInput.type === "password") {
        passInput.type = "text";
        passIcon.className = "bi bi-eye-slash";
      } else {
        passInput.type = "password";
        passIcon.className = "bi bi-eye";
      }
    }
  </script>
</body>
</html>
